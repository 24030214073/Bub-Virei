<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Vira 🎉</title>
<style>
  :root{
    --bg1:#1a0b2e;
    --bg2:#3b1361;
    --pink:#ff6fb5;
    --gold:#ffd66b;
    --white:#fdf6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg1));
    color:var(--white);
    overflow:hidden;
    position:relative;
    padding:20px;
  }
  .stars{
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:white;
    border-radius:50%;
    opacity:0.7;
    animation:twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.2;}
    50%{opacity:1;}
  }
  .container{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:600px;
    width:100%;
    animation:fadeIn 1.2s ease forwards;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:scale(0.9);}
    to{opacity:1;transform:scale(1);}
  }
  h1{
    font-size:2.6rem;
    margin-bottom:10px;
    color:var(--gold);
    text-shadow:0 0 20px rgba(255,214,107,0.5);
  }
  .name{
    font-size:2rem;
    color:var(--pink);
    text-shadow:0 0 25px rgba(255,111,181,0.6);
    margin-bottom:6px;
  }
  .age{
    font-size:1.2rem;
    color:var(--gold);
    margin-bottom:20px;
  }
  .love{
    font-size:1.05rem;
    color:var(--white);
    line-height:1.6;
  }
  .heart{
    font-size:1.4rem;
    display:inline-block;
    animation:beat 1.2s infinite;
  }
  @keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.25);}
  }
  .confetti{
    position:fixed;
    top:-10px;
    z-index:2;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.9; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <h1>🎉 Happy Birthday 🎉</h1>
  <div class="name">Vira Haniifah Septiani</div>
  <div class="age">21st Birthday ✨</div>
  <p class="love">
    Semoga di usia yang baru ini, semua harapan dan mimpimu perlahan menjadi nyata.<br>
    Terima kasih sudah jadi dirimu yang luar biasa.<br><br>
    Im always loving you <span class="heart">❤️</span>
  </p>
</div>

<script>
// Buat bintang random di background
const starsContainer = document.getElementById('stars');
for(let i=0;i<80;i++){
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random()*100 + '%';
  s.style.top = Math.random()*100 + '%';
  s.style.animationDelay = (Math.random()*3) + 's';
  starsContainer.appendChild(s);
}

function launchConfetti(){
  const colors = ['#ff6fb5','#ffd66b','#b385ff','#6fe3ff','#fdf6ff'];
  for(let i=0;i<120;i++){
    setTimeout(()=>{
      const c = document.createElement('div');
      c.className = 'confetti';
      const size = Math.random()*8+6;
      c.style.width = size+'px';
      c.style.height = size*0.4+'px';
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (Math.random()*2+3)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 5500);
    }, i*40);
  }
  setInterval(()=>{
    for(let i=0;i<40;i++){
      setTimeout(()=>{
        const c = document.createElement('div');
        c.className = 'confetti';
        const size = Math.random()*8+6;
        c.style.width = size+'px';
        c.style.height = size*0.4+'px';
        c.style.left = Math.random()*100+'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (Math.random()*2+3)+'s';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 5500);
      }, i*40);
    }
  }, 6000);
}

launchConfetti();
</script>

</body>
</html>
